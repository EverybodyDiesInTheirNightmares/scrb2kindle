name: scrb2kindle daily

on:
  schedule:
    # GitHub cron 一律使用 UTC：UTC 01:10 = 北京时间 09:10（名义时刻）
    # 实测本仓库 scheduled 事件存在约 5.4 小时的系统性延迟（GitHub 平台行为，
    # 与配置无关），该时刻会被推迟到 UTC ~06:30（北京 ~14:30）才真正执行，
    # 故按「名义时刻 = 目标时刻 - 5.4h」反推；若 GitHub 日后恢复准点
    # （09:10 就跑），应把此处改回目标时刻。偶发漏跑由 watchdog.yml 补跑
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYYMMDD（留空则抓取北京时间当天）"
        required: false
        default: ""

permissions:
  contents: read

# 避免上一次未结束就重复触发
concurrency:
  group: scrb2kindle-daily
  cancel-in-progress: false

jobs:
  push-to-kindle:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并推送至 Kindle
        id: push
        # 显式 bash 以启用 pipefail，避免 `| tee` 吞掉脚本的失败退出码
        shell: bash
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          KINDLE_ADDR: ${{ secrets.KINDLE_ADDR }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "== 指定日期: $INPUT_DATE =="
            python scrb2kindle.py --date "$INPUT_DATE" 2>&1 | tee run.log
          else
            echo "== 抓取北京时间当天 =="
            python scrb2kindle.py 2>&1 | tee run.log
          fi
          # 提取 [统计]/[提示]/[失败] 行，作为 Bark 通知正文
          SUMMARY=$(grep -m1 -E '^\[(统计|提示|失败)\]' run.log | sed 's/^\[[^]]*\] //') || true
          echo "stats=${SUMMARY:-无输出}" >> "$GITHUB_OUTPUT"

      - name: 发送 Bark 手机通知（免打扰时段自动跳过）
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          OUTCOME: ${{ steps.push.outcome }}
          STATS: ${{ steps.push.outputs.stats }}
          INPUT_DATE: ${{ inputs.date }}
        run: python bark_notify.py --outcome "$OUTCOME" --date "$INPUT_DATE" --stats "$STATS"
